name: One-time reviewed dependency lock repair (feature branch only)
on:
  push:
    branches: [feat/evidence-real-buyer-arena-audit-20261021]
    paths: ['.github/workflows/repair-lock.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'abrahamhl/buyer-arena' && github.ref == 'refs/heads/feat/evidence-real-buyer-arena-audit-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Reconcile lock from fixed package.json with lifecycle scripts DISABLED
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify strict lock synchronisation WITHOUT executing install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit ONLY generated lock to the existing audit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches"
            exit 0
          fi
          git commit -m "fix(lockfile): resolve TypeScript 6 and Node 22 devDependencies reproducibly"
          git push origin HEAD:refs/heads/feat/evidence-real-buyer-arena-audit-20261021
