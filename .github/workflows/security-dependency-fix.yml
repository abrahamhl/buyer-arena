name: One-shot constrained MCP dependency security patch
on:
  push:
    branches: [feat/evidence-real-buyer-arena-audit-20261021]
    paths: ['.github/workflows/security-dependency-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'abrahamhl/buyer-arena' && github.ref == 'refs/heads/feat/evidence-real-buyer-arena-audit-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Strictly install existing lock without project lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking registry-advised dependency patches only
        run: npm audit fix --ignore-scripts --no-fund
      - name: Require high-severity runtime vulnerabilities to be gone
        run: npm audit --omit=dev --audit-level=high
      - name: Verify new lock, build, types and lint
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          npm run lint
      - name: Commit package and lock only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "::error::Advisory reported, but no eligible compatible patch was applied"
            exit 1
          fi
          git commit -m "fix(deps): apply nonbreaking MCP SDK/Hono audit security patches"
          git push origin HEAD:refs/heads/feat/evidence-real-buyer-arena-audit-20261021
