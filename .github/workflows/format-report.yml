name: One-shot audit report formatting
on:
  push:
    branches: [feat/evidence-real-buyer-arena-audit-20261021]
    paths: ['.github/workflows/format-report.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'abrahamhl/buyer-arena' && github.ref == 'refs/heads/feat/evidence-real-buyer-arena-audit-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write docs/audits/BUYER_ARENA_EXECUTED_PERSONA_AUDIT_20261021.md
      - run: npm run format:check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/BUYER_ARENA_EXECUTED_PERSONA_AUDIT_20261021.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(docs): format actual execution report to project Prettier standard"
          git push origin HEAD:refs/heads/feat/evidence-real-buyer-arena-audit-20261021
