name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Which product question can you not answer today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: evidence
    attributes:
      {
        label: How would the result stay evidence-based?,
        description: Buyer Arena findings must cite recorded events.,
      }
