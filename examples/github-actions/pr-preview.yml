# Example caller: synthetic buyers on every pull request against its preview deployment.
# Pair it with examples/github-actions/pr-comment.yml to post the compact summary.
name: Buyer Arena
on: pull_request
permissions:
  contents: read
jobs:
  buyers:
    uses: abrahamhl/buyer-arena/.github/workflows/buyer-arena-pr.yml@main # pin a commit SHA
    with:
      baseline-url: ${{ vars.PRODUCTION_URL }}
      candidate-url: ${{ vars.PREVIEW_URL_PREFIX }}${{ github.event.number }}
      success-text: 'welcome|trial is active'
